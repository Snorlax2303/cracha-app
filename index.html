<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microset | Gerador de identificacao</title>
  <style>
    :root{--canvas:#ede7da;--paper:#f7f2e8;--surface:#f3eddf;--ink:#17262b;--muted:#647271;--line:#d9d0bf;--teal:#005e63;--teal-2:#087b7f;--red:#d9363e;--shadow:8px 8px 17px #c7bdac,-8px -8px 17px #fffaf0;--inset:inset 3px 3px 7px #cbc1b0,inset -3px -3px 7px #fffaf0}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:15px;letter-spacing:-.01em}.shell{max-width:1280px;margin:auto;padding:40px 30px 64px}.masthead{display:flex;justify-content:space-between;align-items:end;padding:0 3px 28px;border-bottom:1px solid var(--line);margin-bottom:28px}.mark{font-weight:900;font-size:25px;letter-spacing:-.07em;color:var(--teal)}.mark span{color:var(--ink)}.masthead p{margin:6px 0 0;color:var(--muted);font-size:14px}.status{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);padding:9px 13px;border-radius:999px;box-shadow:var(--inset)}.grid{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(380px,1.05fr);gap:34px;align-items:start}.panel{padding:28px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}.panel-title{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--line)}h1,h2,h3,p{margin:0}h2{font-size:17px;letter-spacing:-.035em}small{color:var(--muted);font-size:12px}.field{margin-bottom:17px}.field label{display:block;margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#506061}.split{display:grid;grid-template-columns:1fr 1fr;gap:13px}input,select,textarea{width:100%;border:0;outline:0;background:#efe9dc;color:var(--ink);border-radius:10px;padding:12px 13px;font:inherit;box-shadow:var(--inset)}input:focus,select:focus,textarea:focus{box-shadow:inset 2px 2px 5px #c8bead,0 0 0 2px #00777a55}textarea{min-height:91px;resize:vertical}.relational{padding:15px;border-radius:14px;background:#e9e2d3;box-shadow:var(--inset);margin-bottom:17px}.hidden{display:none!important}.helper{font-size:12px;color:var(--muted);line-height:1.45;margin-top:-4px}.buttons{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:24px}button{border:0;border-radius:11px;padding:13px 15px;background:var(--surface);color:var(--ink);font:700 14px inherit;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px);box-shadow:var(--inset)}.primary{color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal-2));box-shadow:5px 6px 12px #aaa18f,-3px -3px 10px #fffaf0}.danger-action{grid-column:span 2}.preview .panel-title{margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{padding:8px 13px;font-size:12px;box-shadow:none;background:transparent}.tabs button.active{color:#fff;background:var(--teal);box-shadow:3px 3px 8px #b8ae9c}.stage{padding:24px;border-radius:17px;background:#e6dece;box-shadow:var(--inset);display:flex;justify-content:center}.stage canvas{display:block;width:min(100%,448px);height:auto;background:white;border-radius:12px;box-shadow:12px 14px 24px #a79d8e}.legend{display:flex;gap:15px;justify-content:center;margin-top:16px;font-size:11px;color:var(--muted)}.legend b{color:var(--teal)}@media(max-width:900px){.grid{grid-template-columns:1fr}.preview{order:-1}}@media(max-width:580px){.shell{padding:24px 14px 40px}.masthead{align-items:start;gap:13px;flex-direction:column}.panel{padding:20px;border-radius:18px}.split{grid-template-columns:1fr}.buttons{grid-template-columns:1fr}.danger-action{grid-column:auto}.stage{padding:12px}}
  </style>
</head>
<body><main class="shell">
  <header class="masthead"><div><div class="mark">MICRO<span>SET</span></div><p>Gerador de identificacao corporativa e etiquetas de bloqueio.</p></div><div class="status">documentos operacionais</div></header>
  <div class="grid"><section class="panel"><div class="panel-title"><h2>Dados do documento</h2><small>Preencha para atualizar</small></div>
    <div class="field"><label for="layout">Tipo de layout</label><select id="layout"><option value="corporate">Crach&aacute; corporativo</option><option value="danger">Etiqueta de perigo / bloqueio</option></select></div>
    <div id="corporateFields"><div class="relational"><div class="field"><label for="relationship">Vinculo</label><select id="relationship"><option>Colaborador Microset</option><option>Microset x empresa parceira</option></select></div><div class="field partner hidden"><label for="partner">Empresa parceira</label><input id="partner" placeholder="Ex.: Empresa X"></div></div><div class="field"><label for="name">Nome completo</label><input id="name" placeholder="Ex.: Maria Eduarda Silva"></div><div class="split"><div class="field"><label for="role">Funcao</label><input id="role" placeholder="Ex.: Tecnica de TI"></div><div class="field"><label for="department">Departamento</label><input id="department" placeholder="Ex.: Operacoes"></div></div><div class="field"><label for="document">CPF / documento</label><input id="document" placeholder="Opcional"></div><div class="field"><label for="photo">Foto do colaborador</label><input id="photo" type="file" accept="image/*"></div></div>
    <div id="dangerFields" class="hidden"><div class="field"><label for="dangerName">Nome</label><input id="dangerName" placeholder="Nome do responsavel"></div><div class="split"><div class="field"><label for="dangerRole">Funcao</label><input id="dangerRole" placeholder="Ex.: Manutencao"></div><div class="field"><label for="dangerDept">Departamento</label><input id="dangerDept" placeholder="Ex.: Eletrica"></div></div><div class="field"><label for="reason">Motivo do bloqueio</label><input id="reason" placeholder="Ex.: Manutencao preventiva"></div><div class="split"><div class="field"><label for="date">Data</label><input id="date" type="date"></div><div class="field"><label for="time">Hora</label><input id="time" type="time"></div></div><div class="field"><label for="message">Mensagem personalizada (verso)</label><textarea id="message">ESTA ETIQUETA E CADEADO SO PODEM SER REMOVIDOS PELA PESSOA INDICADA NO VERSO.</textarea></div><p class="helper">A etiqueta gera frente e verso separados para impressao.</p></div>
    <div class="buttons"><button class="primary" id="download">Baixar imagem</button><button id="clear">Limpar campos</button><button class="danger-action hidden" id="downloadBack">Baixar verso da etiqueta</button></div>
  </section><section class="panel preview"><div class="panel-title"><h2>Pre-visualizacao</h2><small id="caption">Crach&aacute; corporativo</small></div><div class="tabs hidden" id="sideTabs"><button class="active" data-side="front">Frente</button><button data-side="back">Verso</button></div><div class="stage"><canvas id="canvas" width="720" height="1120"></canvas></div><div class="legend"><span><b>Microset</b> | uso interno</span><span>720 x 1120 px</span></div></section></div>
</main>
<script>
const byId=id=>document.getElementById(id),canvas=byId('canvas'),ctx=canvas.getContext('2d');let side='front',photo=null;
const fields=[...document.querySelectorAll('input:not([type=file]),select,textarea')];fields.forEach(el=>el.addEventListener('input',draw));
byId('layout').addEventListener('change',()=>{const d=byId('layout').value==='danger';byId('corporateFields').classList.toggle('hidden',d);byId('dangerFields').classList.toggle('hidden',!d);byId('sideTabs').classList.toggle('hidden',!d);byId('downloadBack').classList.toggle('hidden',!d);side='front';setTabs();draw()});
byId('relationship').addEventListener('change',()=>{document.querySelector('.partner').classList.toggle('hidden',byId('relationship').selectedIndex!==1);draw()});
byId('photo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;photo=new Image();photo.onload=draw;photo.src=URL.createObjectURL(file)});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;setTabs();draw()});
function setTabs(){document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('active',b.dataset.side===side))}function value(id,fallback=''){return byId(id).value.trim()||fallback}function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.closePath()}function wrap(text,x,y,max,font,line){ctx.font=`700 ${font}px Arial`;let row='',n=0;for(const word of text.split(/\s+/)){const next=(row+' '+word).trim();if(ctx.measureText(next).width>max&&row){ctx.fillText(row,x,y+n*line);row=word;n++}else row=next}if(row)ctx.fillText(row,x,y+n*line);return n+1}
function corporate(){ctx.fillStyle='#f8f4ea';ctx.fillRect(0,0,720,1120);ctx.fillStyle='#005e63';ctx.fillRect(0,0,720,252);ctx.fillStyle='#0c3033';ctx.globalAlpha=.13;for(let x=-230;x<850;x+=92){ctx.fillRect(x,0,36,252)}ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='900 45px Arial';ctx.fillText('MICROSET',63,105);ctx.fillStyle='#9de2dc';ctx.font='700 15px Arial';ctx.fillText('IDENTIFICACAO CORPORATIVA',66,137);ctx.fillStyle='#e8ddca';ctx.fillRect(0,252,720,14);ctx.fillStyle='#203035';ctx.font='900 40px Arial';wrap(value('name','NOME COMPLETO').toUpperCase(),65,343,390,37,45);ctx.fillStyle='#087b7f';ctx.font='700 24px Arial';ctx.fillText(value('role','FUNCAO').toUpperCase(),66,440);ctx.fillStyle='#63716f';ctx.font='600 19px Arial';ctx.fillText(value('department','DEPARTAMENTO').toUpperCase(),66,474);ctx.save();ctx.beginPath();ctx.arc(563,387,92,0,Math.PI*2);ctx.clip();if(photo){const s=Math.max(184/photo.naturalWidth,184/photo.naturalHeight);ctx.drawImage(photo,563-photo.naturalWidth*s/2,387-photo.naturalHeight*s/2,photo.naturalWidth*s,photo.naturalHeight*s)}else{ctx.fillStyle='#d6d0c4';ctx.fillRect(471,295,184,184);ctx.fillStyle='#a2aaa4';ctx.beginPath();ctx.arc(563,362,31,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(563,475,72,Math.PI,0);ctx.fill()}ctx.restore();ctx.strokeStyle='#087b7f';ctx.lineWidth=7;ctx.beginPath();ctx.arc(563,387,95,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#eee7d9';rr(65,552,590,105,15);ctx.fill();ctx.fillStyle='#5d6b69';ctx.font='800 13px Arial';ctx.fillText('DOCUMENTO',90,592);ctx.fillStyle='#1f3132';ctx.font='800 27px Arial';ctx.fillText(value('document','---'),90,630);ctx.fillStyle='#e0f0ed';rr(65,700,590,130,15);ctx.fill();ctx.fillStyle='#006369';ctx.font='800 14px Arial';ctx.fillText('VINCULO',90,743);ctx.font='900 25px Arial';ctx.fillText(byId('relationship').selectedIndex===1?'MICROSET X '+value('partner','EMPRESA X').toUpperCase():'COLABORADOR MICROSET',90,788);ctx.fillStyle='#17383b';ctx.fillRect(0,1030,720,90);ctx.fillStyle='#bdece6';ctx.font='700 15px Arial';ctx.fillText('MICROSET | SOLUCOES EM TECNOLOGIA',65,1084)}
function hazardBase(subtitle){ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,720,1120);ctx.save();ctx.strokeStyle='#d9363e';ctx.lineWidth=27;for(let x=-280;x<960;x+=115){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+455,1120);ctx.stroke()}ctx.restore();ctx.fillStyle='#fffdf8';rr(46,43,628,240,18);ctx.fill();ctx.fillStyle='#d9363e';rr(68,67,584,121,12);ctx.fill();ctx.strokeStyle='#1c2527';ctx.lineWidth=7;rr(68,67,584,121,12);ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 63px Arial';ctx.fillText('PERIGO',360,146);ctx.fillStyle='#1c2527';ctx.font='900 35px Arial';ctx.fillText(subtitle,360,244);ctx.textAlign='left'}
function front(){hazardBase('NAO LIGUE');ctx.fillStyle='#fffdf8';rr(54,315,612,685,18);ctx.fill();ctx.fillStyle='#d9363e';ctx.fillRect(54,315,17,685);ctx.fillStyle='#202a2c';ctx.font='900 18px Arial';ctx.fillText('ESTOU TRABALHANDO NESTE EQUIPAMENTO',96,366);ctx.strokeStyle='#1c2527';ctx.lineWidth=3;ctx.strokeRect(468,345,137,165);let data=[['NOME',value('dangerName')],['FUNCAO',value('dangerRole')],['DEPTO',value('dangerDept')],['MOTIVO',value('reason')],['DATA',value('date','__/__/____')],['HORA',value('time','__:__')]],y=570;for(const [key,item] of data){ctx.fillStyle='#1e292b';ctx.font='800 15px Arial';ctx.fillText(key+':',96,y);ctx.beginPath();ctx.moveTo(190,y+5);ctx.lineTo(604,y+5);ctx.stroke();ctx.font='500 16px Arial';ctx.fillText(item,198,y);y+=61}ctx.fillStyle='#c92f38';ctx.font='900 14px Arial';ctx.fillText('MICROSET | ETIQUETA DE BLOQUEIO',96,950)}
function back(){hazardBase('BLOQUEIO DE SEGURANCA');ctx.fillStyle='#fffdf8';rr(54,315,612,685,18);ctx.fill();ctx.fillStyle='#202a2c';ctx.textAlign='center';wrap(value('message','MENSAGEM DE SEGURANCA').toUpperCase(),360,438,474,27,38);ctx.fillStyle='#c92f38';ctx.font='900 18px Arial';ctx.fillText('SOMENTE PESSOA AUTORIZADA PODE REMOVER',360,802);ctx.fillStyle='#586663';ctx.font='700 15px Arial';ctx.fillText('MICROSET | SEGURANCA EM PRIMEIRO LUGAR',360,857);ctx.textAlign='left'}
function draw(){ctx.clearRect(0,0,720,1120);const danger=byId('layout').value==='danger';if(!danger){corporate();byId('caption').innerHTML='Crach&aacute; corporativo'}else{side==='front'?front():back();byId('caption').textContent='Etiqueta de bloqueio | '+(side==='front'?'frente':'verso')}}function save(name){canvas.toBlob(blob=>{const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),500)},'image/png')}byId('download').onclick=()=>save(byId('layout').value==='danger'?'etiqueta-perigo-frente.png':'cracha-microset.png');byId('downloadBack').onclick=()=>{side='back';setTabs();draw();save('etiqueta-perigo-verso.png')};byId('clear').onclick=()=>{fields.forEach(x=>{if(!['layout','relationship','message','date','time'].includes(x.id))x.value=''});byId('photo').value='';photo=null;draw()};byId('date').value=new Date().toISOString().slice(0,10);byId('time').value=new Date().toTimeString().slice(0,5);draw();
</script></body></html>
