  <style>
    :root{--blue:#003e70;--cyan:#00a8dc;--red:#e3212b;--ink:#16212b;--soft:#f1f5f8}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:var(--ink);background:#e9eff3}.app{max-width:1250px;margin:auto;padding:28px 18px 48px}header{color:white;background:linear-gradient(120deg,var(--blue),#0876a6);padding:25px 30px;border-radius:18px;margin-bottom:22px}.brand{font-weight:800;font-size:26px;letter-spacing:2px}.brand span{color:#64d8ff}header p{margin:7px 0 0;color:#d9f3ff}.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(350px,1.1fr);gap:22px}.panel{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 25px #17334a18}h2{font-size:18px;margin:0 0 18px}.field{margin:0 0 15px}.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:bold;color:#52616d;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd7df;border-radius:8px;font:inherit;background:white}textarea{min-height:82px;resize:vertical}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#62717d;line-height:1.4;margin:-5px 0 15px}.company{display:flex;gap:8px;align-items:center;background:#eef8fc;padding:12px;border-radius:9px;color:#07527b;font-weight:bold}.company b{color:var(--blue)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:8px;padding:12px 16px;color:#fff;background:var(--blue);font-weight:bold;cursor:pointer}button.secondary{background:#5a6872}.preview-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.preview-title small{color:#61717d}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:#e6edf2;color:#42515c;padding:8px 11px}.tabs button.active{background:var(--red);color:#fff}.canvas-wrap{background:#dce4e9;border-radius:12px;padding:18px;display:flex;justify-content:center;overflow:auto}canvas{width:min(100%,430px);height:auto;background:#fff;box-sha <body><main class="app">
  <header><div class="brand">MICRO<span>SET</span></div><p>Gerador de identificaÃ§Ã£o corporativa e etiquetas de bloqueio.</p></header>
  <div class="grid"><section class="panel"><h2>Dados do documento</h2>
    <div class="field"><label>Tipo de layout</label><select id="layout"><option value="corporate">CrachÃ¡ corporativo</option><option value="danger">Etiqueta de perigo / bloqueio</option></select></div>
    <div id="corporateFields"><div class="field"><label>VÃ­nculo</label><select id="relationship"><option>Colaborador Microset</option><option>Microset Ã— Empresa parceira</option></select></div><div class="field partner hidden"><label>Empresa parceira</label><input id="partner" placeholder="Ex.: Empresa X"></div><div class="field"><label>Nome completo</label><input id="name" placeholder="Ex.: Maria Eduarda Silva"></div><div class="pair"><div class="field"><label>FunÃ§Ã£o</label><input id="role" placeholder="Ex.: TÃ©cnica de TI"></div><div class="field"><label>Departamento</label><input id="department" placeholder="Ex.: OperaÃ§Ãµes"></div></div><div class="field"><label>CPF / documento</label><input id="document" placeholder="Opcional"></div><div class="field"><label>Foto do colaborador (opcional)</label><input id="photo" type="file" accept="image/*"></div></div>
    <div id="dangerFields" class="hidden"><div class="field"><label>Nome</label><input id="dangerName" placeholder="Nome do responsÃ¡vel"></div><div class="pair"><div class="field"><label>FunÃ§Ã£o</label><input id="dangerRole" placeholder="Ex.: ManutenÃ§Ã£o"></div><div class="field"><label>Departamento</label><input id="dangerDept" placeholder="Ex.: ElÃ©trica"></div></div><div class="field"><label>Motivo do bloqueio</label><input id="reason" placeholder="Ex.: ManutenÃ§Ã£o preventiva"></div><div class="pair"><div class="field"><label>Data</label><input id="date" type="date"></div><div class="field"><label>Hora</label><input id="time" type="time"></div></div><div class="field"><label>Mensagem personalizada (verso)</label><textarea id="message">ESTA ETIQUETA E CADEADO SÃ“ PODEM SER REMOVIDOS PELA PESSOA INDICADA NO VERSO.</textarea></div><p class="hint">A etiqueta gera frente e verso separados para impressÃ£o. O alerta â€œPERIGO â€” NÃƒO LIGUEâ€ fica sempre na frente.</p></div>
    <div class="actions"><button id="download">Baixar imagem</button><button id="downloadBack" class="secondary hidden">Baixar verso</button><button id="clear" class="secondary">Limpar</button></div>
  </section><section class="panel"><div class="preview-title"><h2>PrÃ©-visualizaÃ§Ã£o</h2><small id="dimension"></small></div><div id="sideTabs" class="tabs hidden"><button class="active" data-side="front">Frente</button><button data-side="back">Verso</button></div><div class="canvas-wrap"><canvas id="canvas" width="720" height="1120"></canvas></div></section></div>
</main><script>
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d');let side='front',photo=null;
const inputs=[...document.querySelectorAll('input,select,textarea')];inputs.forEach(x=>x.addEventListener('input',draw));
$('layout').addEventListener('change',()=>{const danger=$('layout').value==='danger';$('corporateFields').classList.toggle('hidden',danger);$('dangerFields').classList.toggle('hidden',!danger);$('sideTabs').classList.toggle('hidden',!danger);$('downloadBack').classList.toggle('hidden',!danger);side='front';setActive();draw()});
$('relationship').addEventListener('change',()=>{document.querySelector('.partner').classList.toggle('hidden',$('relationship').value!=='Microset Ã— Empresa parceira');draw()});$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;photo=new Image();photo.onload=draw;photo.src=URL.createObjectURL(f)});
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;setActive();draw()});function setActive(){document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('active',b.dataset.side===side))}
function val(id,fallback=''){return $(id).value.trim()||fallback}function line(y,text,size=24){ctx.font=`700 ${size}px Arial`;ctx.fillText(text,76,y)}function wrap(text,x,y,max,width,lineHeight){ctx.font=`700 ${width}px Arial`;let words=text.split(/\s+/),row='',n=0;for(const word of words){let test=(row+' '+word).trim();if(ctx.measureText(test).width>max&&row){ctx.fillText(row,x,y+n*lineHeight);row=word;n++}else row=test}if(row)ctx.fillText(row,x,y+n*lineHeight);return n+1}
function header(){ctx.fillStyle='#003e70';ctx.fillRect(0,0,720,1120);ctx.fillStyle='#fff';ctx.font='800 43px Arial';ctx.fillText('MICROSET',72,110);ctx.font='600 17px Arial';ctx.fillStyle='#8be2ff';ctx.fillText('IDENTIFICAÃ‡ÃƒO CORPORATIVA',74,142)}
function drawCorporate(){header();ctx.fillStyle='#f7fafc';ctx.fillRect(0,220,720,900);ctx.fillStyle='#00a8dc';ctx.fillRect(0,220,720,11);ctx.fillStyle='#003e70';ctx.font='800 42px Arial';ctx.fillText(val('name','NOME COMPLETO').toUpperCase(),72,337);ctx.fillStyle='#00a8dc';ctx.font='700 28px Arial';ctx.fillText(val('role','FUNÃ‡ÃƒO').toUpperCase(),72,390);ctx.fillStyle='#536574';ctx.font='600 20px Arial';ctx.fillText(val('department','DEPARTAMENTO').toUpperCase(),72,428);ctx.save();ctx.beginPath();ctx.arc(548,385,90,0,Math.PI*2);ctx.clip();if(photo){const s=Math.max(180/photo.naturalWidth,180/photo.naturalHeight);ctx.drawImage(photo,548-photo.naturalWidth*s/2,385-photo.naturalHeight*s/2,photo.naturalWidth*s,photo.naturalHeight*s)}else{ctx.fillStyle='#cfdae1';ctx.fillRect(458,295,180,180);ctx.fillStyle='#93a5af';ctx.beginPath();ctx.arc(548,360,32,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(548,470,72,Math.PI,0);ctx.fill()}ctx.restore();ctx.strokeStyle='#00a8dc';ctx.lineWidth=7;ctx.beginPath();ctx.arc(548,385,93,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ccd8df';ctx.lineWidth=2;ctx.strokeRect(70,488,580,122);ctx.fillStyle='#647581';ctx.font='700 15px Arial';ctx.fillText('DOCUMENTO',92,527);ctx.fillStyle='#17222c';ctx.font='700 27px Arial';ctx.fillText(val('document','â€”'),92,575);ctx.fillStyle='#e9f7fc';ctx.fillRect(70,662,580,144);ctx.fillStyle='#07527b';ctx.font='700 17px Arial';ctx.fillText('VÃNCULO',92,706);ctx.font='800 25px Arial';ctx.fillText($('relationship').value==='Microset Ã— Empresa parceira'?'MICROSET Ã— '+val('partner','EMPRESA X').toUpperCase():'COLABORADOR MICROSET',92,751);ctx.fillStyle='#003e70';ctx.fillRect(0,1030,720,90);ctx.fillStyle='#fff';ctx.font='600 16px Arial';ctx.fillText('MICROSET Â· SOLUÃ‡Ã•ES EM TECNOLOGIA',72,1084)}
function stripes(){ctx.save();ctx.strokeStyle='#ee2936';ctx.lineWidth=26;for(let x=-230;x<940;x+=105){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+420,1120);ctx.stroke()}ctx.restore()}
function dangerHeader(label){ctx.fillStyle='#fff';ctx.fillRect(0,0,720,1120);stripes();ctx.fillStyle='#fff';ctx.fillRect(52,52,616,150);ctx.fillStyle='#e3212b';ctx.fillRect(66,66,588,122);ctx.strokeStyle='#222';ctx.lineWidth=8;ctx.strokeRect(62,62,596,130);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='900 66px Arial';ctx.fillText('PERIGO',360,146);ctx.fillStyle='#20262a';ctx.font='900 39px Arial';ctx.fillText(label,360,256);ctx.textAlign='left'}
function drawDangerFront(){dangerHeader('NÃƒO LIGUE');ctx.fillStyle='#fff';ctx.fillRect(57,290,606,720);ctx.fillStyle='#e3212b';ctx.fillRect(57,290,18,720);ctx.fillStyle='#222';ctx.font='900 19px Arial';ctx.fillText('ESTOU TRABALHANDO NESTE EQUIPAMENTO',98,344);ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.strokeRect(455,326,155,188);let rows=[['NOME',val('dangerName','')],['FUNÃ‡ÃƒO',val('dangerRole','')],['DEPTO.',val('dangerDept','')],['MOTIVO',val('reason','')],['DATA',val('date','____/____/______')],['HORA',val('time','__:__')]];let y=572;ctx.font='700 17px Arial';for(const [k,v] of rows){ctx.fillStyle='#222';ctx.fillText(k+':',98,y);ctx.beginPath();ctx.moveTo(190,y+5);ctx.lineTo(610,y+5);ctx.stroke();ctx.font='500 17px Arial';ctx.fillText(v,198,y);ctx.font='700 17px Arial';y+=62}ctx.fillStyle='#e3212b';ctx.font='800 15px Arial';ctx.fillText('MICROSET Â· ETIQUETA DE BLOQUEIO',98,950)}
function drawDangerBack(){dangerHeader('BLOQUEIO DE SEGURANÃ‡A');ctx.fillStyle='#fff';ctx.fillRect(57,300,606,680);ctx.fillStyle='#222';ctx.textAlign='center';let msg=val('message','MENSAGEM DE SEGURANÃ‡A');wrap(msg.toUpperCase(),360,430,480,26,36);ctx.font='800 22px Arial';ctx.fillStyle='#e3212b';ctx.fillText('SOMENTE A PESSOA AUTORIZADA PODE REMOVER',360,805);ctx.font='600 16px Arial';ctx.fillStyle='#3c464e';ctx.fillText('MICROSET Â· SEGURANÃ‡A EM PRIMEIRO LUGAR',360,858);ctx.textAlign='left'}
function draw(){ctx.clearRect(0,0,720,1120);if($('layout').value==='corporate'){drawCorporate();$('dimension').textContent='CrachÃ¡ corporativo'}else{side==='front'?drawDangerFront():drawDangerBack();$('dimension').textContent='Etiqueta de bloqueio Â· '+(side==='front'?'frente':'verso')}}
function save(name){canvas.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},'image/png')}$('download').onclick=()=>save($('layout').value==='danger'?'etiqueta-perigo-frente.png':'cracha-microset.png');$('downloadBack').onclick=()=>{side='back';setActive();draw();save('etiqueta-perigo-verso.png')};$('clear').onclick=()=>{inputs.forEach(x=>{if(!['layout','relationship','message','date','time','photo'].includes(x.id))x.value=''});$('photo').value='';photo=null;draw()};
$('date').value=new Date().toISOString().slice(0,10);$('time').value=new Date().toTimeString().slice(0,5);draw();
</script></body></html>
